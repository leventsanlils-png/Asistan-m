<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Levent Şanlı · Asistanım</title>
<style id="appstyle">
:root{color-scheme:dark;--bg:#070d22;--card:rgba(14,24,56,.82);--ink:#eaf0ff;--mut:#9fb0d6;--line:rgba(120,160,255,.18);--soft:rgba(255,255,255,.06);--acc:#22b8ff;
--okul:#3b82f6;--kulup:#ef3349;--aile:#a855f7;--kisisel:#fb8c1a;--serbest:#14d3b5;--rutin:#8a9bc4;--odeme:#22c55e;
--late:#ff4d5e;--soon:#fbbf24;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,rgba(34,184,255,.18),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(168,85,247,.16),transparent 60%),var(--bg) fixed;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 100px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--mut);font-weight:500}
.sub{color:var(--mut);font-size:13px}
.status{font-size:12px;color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;margin:6px 0 16px;padding-bottom:2px}
nav button{flex:none}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on,button.pri{background:linear-gradient(135deg,#1e90ff,#22d3ee);border-color:transparent;color:#fff;box-shadow:0 0 14px rgba(34,184,255,.35)}
button.sm{padding:3px 9px;font-size:13px;border-radius:7px}
button.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 40%,var(--line))}
button.danger.arm{background:var(--late);color:#fff}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr!important}}
@media (max-width:520px){.wrap{padding:12px 10px 100px}.card{padding:12px}.blk{grid-template-columns:20px 78px 1fr auto;gap:8px}.row{flex-wrap:wrap}.mini{grid-template-columns:78px 1fr}h1{font-size:19px}.catbar{grid-template-columns:90px 1fr 70px}}
.card{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--line);box-shadow:0 0 0 1px rgba(34,184,255,.04),0 10px 30px rgba(0,0,0,.25);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:500;color:var(--mut);font-size:13px}
.muted{color:var(--mut)}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.blk{--c:var(--rutin);display:grid;grid-template-columns:20px 94px 1fr auto;gap:10px;align-items:start;padding:9px 10px;border-left:4px solid var(--c);border-radius:8px;margin:6px 0;background:color-mix(in srgb,var(--c) 7%,var(--card));cursor:pointer}
.blk input{margin-top:3px;accent-color:var(--c)}
.blk .tm{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;padding-top:1px}
.blk .bd b{display:block;font-weight:600}
.blk .bd small{display:block;color:var(--mut);font-size:13px}
.blk.done .bd b{text-decoration:line-through;opacity:.6}
.blk.now{box-shadow:0 0 0 2px var(--c)}
.nowtag{background:var(--c);color:#fff;font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600}
.tg{display:inline-block;font-size:11px;font-weight:600;color:var(--c);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px}
.okul{--c:var(--okul)}.kulup{--c:var(--kulup)}.aile{--c:var(--aile)}.kisisel{--c:var(--kisisel)}.serbest{--c:var(--serbest)}.rutin{--c:var(--rutin)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block}
.row .grow small{color:var(--mut);font-size:12.5px}
.day{width:42px;text-align:center;border-radius:9px;background:var(--soft);padding:4px 0;font-weight:700;line-height:1.1}
.day small{display:block;font-weight:500;font-size:10.5px;color:var(--mut)}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.paid{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.late{background:color-mix(in srgb,var(--late) 15%,transparent);color:var(--late)}
.pill.soon{background:color-mix(in srgb,var(--soon) 18%,transparent);color:var(--soon)}
nav button.on .pill{background:#fff}
.side .row{flex-wrap:wrap}
.pill.wait{background:var(--soft);color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{color:var(--mut);font-size:12px;display:block}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
form.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type=checkbox]{width:18px;height:18px;padding:0}
.hide{display:none!important}
table.hg{width:100%;border-collapse:collapse;font-size:14px}
table.hg th,table.hg td{padding:7px 4px;text-align:center;border-top:1px solid var(--line)}
table.hg th:first-child,table.hg td:first-child{text-align:left}
table.hg th{font-size:12px;color:var(--mut);font-weight:600;border-top:0}
table.hg th.td{color:var(--acc)}
.catbar{display:grid;grid-template-columns:110px 1fr 60px;gap:8px;align-items:center;margin:6px 0;font-size:13.5px}
.catbar .bar i{background:var(--c)}
.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ideas ul{margin:6px 0 0;padding-left:18px}
.ideas li{margin:3px 0}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.mnav{display:flex;align-items:center;gap:8px}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
.hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 0 0 1px rgba(34,184,255,.35),0 0 40px rgba(34,184,255,.25)}
.hero img{display:block;width:100%;height:auto}
.hs{position:absolute;background:transparent;border:2px solid transparent;border-radius:14px;padding:0;cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .15s}
.hs:hover,.hs:focus-visible{border-color:rgba(255,255,255,.85);box-shadow:0 0 22px rgba(120,200,255,.9);transform:scale(1.03);outline:none}
.hero .hs.on{background:transparent;border-color:#fff;box-shadow:0 0 26px rgba(255,255,255,.8)}
.hero .hs{color:transparent}
.hs span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.odeme{--c:var(--odeme)}
.todo{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo.done span{text-decoration:line-through;opacity:.55}
.todo span{flex:1}
.wkday{margin:10px 0 2px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.wkday.td{color:var(--acc)}
.mini{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:5px 10px;border-left:3px solid var(--c);border-radius:6px;margin:4px 0;background:color-mix(in srgb,var(--c) 9%,transparent);font-size:14px}
.mini .tm{color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
.areahead{border-left:5px solid var(--c)}
.vsug{width:100%;margin-top:6px}
.kp{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;white-space:nowrap}
.kp.gonderi{background:linear-gradient(135deg,#f58529,#dd2a7b)}
.kp.reels{background:linear-gradient(135deg,#8134af,#dd2a7b)}
.kp.hikaye{background:linear-gradient(135deg,#feda75,#fa7e1e);color:#3a2000}
.kp.wa{background:#25d366;color:#04310f}
a.btn{text-decoration:none;display:inline-block}
a.btn.sm{padding:3px 9px;font-size:13px;border-radius:7px}
.wa-send{background:#25d366!important;color:#04310f!important;border-color:#25d366!important;font-weight:700}
.wamsg{display:block;margin-top:5px;white-space:pre-wrap;background:var(--soft);padding:7px 9px;border-radius:8px;font-size:13px;color:var(--ink)}
.waact{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sstat{padding:3px 6px;font-size:12.5px}
.met{font-size:12.5px;color:var(--mut)}
.chips button{padding:4px 10px;font-size:13px}
.late-t{color:var(--late);font-weight:600}
textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:70px;resize:vertical;width:100%}
#voice{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#vfab{border-radius:30px;padding:11px 18px;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#vfab.live{background:var(--late);border-color:var(--late)}
.vpanel{width:min(360px,calc(100vw - 32px));background:#0d1736;max-height:calc(100vh - 90px);overflow-y:auto;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 36px rgba(0,0,0,.2)}
.vpanel h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.vbox{background:var(--soft);border-radius:10px;padding:9px 11px;margin:8px 0;font-size:14px}
.vbox.q{font-style:italic}
.vbox.a{background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.vmic{width:100%;padding:12px;font-weight:600;font-size:15px}
.vmic.live{background:var(--late);border-color:var(--late);color:#fff}
#vform{display:flex;gap:6px;margin-top:8px}
#vform input{flex:1}
.vhint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5}
</style>
</head>

function readState(){

  try{var ls=JSON.parse(localStorage.getItem(LSKEY)||'null'); if(ls&&(ls.savedAt||0)>(s.savedAt||0)) s=ls;}catch(e){}
  return normalizeState(s);
}
function normalizeState(s){
  s=s&&typeof s==='object'?s:{};
  if(!Array.isArray(s.payments)) s.payments=defaultPayments();
  if(!Array.isArray(s.habits)) s.habits=defaultHabits();
  s.club=s.club||[];s.social=s.social||defaultSocial();['accounts','posts','followers','wa'].forEach(function(k){if(!Array.isArray(s.social[k])) s.social[k]=[];});s.social.targets=s.social.targets||{gonderi:2,reels:2,hikaye:5};s.todos=s.todos||{okul:[],kulup:[],aile:[],kisisel:[]};s.paid=s.paid||{}; s.daily=s.daily||[]; s.checks=s.checks||{}; s.habitLog=s.habitLog||{};
  if(typeof s.dailyLimit!=='number') s.dailyLimit=0;
  if(!s.since){var n=new Date();s.since=n.getFullYear()+'-'+(n.getMonth()<9?'0':'')+(n.getMonth()+1)+'-'+(n.getDate()<10?'0':'')+n.getDate();}
  return s;
}

/* ---------- HELPERS ---------- */
function pad(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function ymk(y,m){return y+'-'+pad(m+1);}
function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
function toMin(t){var p=t.split(':');return +p[0]*60+ +p[1];}
function weekDates(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));var a=[];for(var i=0;i<7;i++){var y=new Date(x);y.setDate(x.getDate()+i);a.push(y);}return a;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var fmt=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2});
function money(n){return fmt.format(n||0);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function opts(list,sel){return list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';}).join('');}

function duesForMonth(y,m){
  var key=ymk(y,m),dim=new Date(y,m+1,0).getDate(),out=[];
  state.payments.forEach(function(p){
    var day=null;
    if(p.freq==='aylik') day=Math.min(+p.due||1,dim);
    else if(p.freq==='yillik'){ if(+p.month===m+1) day=Math.min(+p.due||1,dim); }
    else if(p.freq==='tek'){ if(p.date&&p.date.slice(0,7)===key) day=+p.date.slice(8,10); }
    if(day==null) return;
    out.push({p:p,date:new Date(y,m,day),key:key,paidOn:(state.paid[key]||{})[p.id]});
  });
  return out.sort(function(a,b){return a.date-b.date;});
}
function stat(x){if(x.paidOn) return 'paid';if(!x.p.amount||ymd(x.date)<state.since) return 'wait';var diff=Math.round((x.date-today())/864e5);if(diff<0) return 'late';if(diff<=3) return 'soon';return 'wait';}
function statLabel(x){var s=stat(x),diff=Math.round((x.date-today())/864e5);
  if(s==='paid') return 'Ödendi';if(!x.paidOn&&ymd(x.date)<state.since) return 'Takip öncesi';if(!x.paidOn&&!x.p.amount&&diff<0) return 'Tutar yok';if(s==='late') return (-diff)+' gün gecikti';if(diff===0) return 'Bugün';if(diff===1) return 'Yarın';return diff+' gün kaldı';}
function upcoming(){
  var t=today(),out=[];
  [-1,0,1].forEach(function(k){var d=new Date(t.getFullYear(),t.getMonth()+k,1);out=out.concat(duesForMonth(d.getFullYear(),d.getMonth()));});
  return out.filter(function(x){if(x.paidOn||!x.p.amount||ymd(x.date)<state.since) return false;var diff=(x.date-t)/864e5;return diff<=7;});
}

function parseImport(txt){
  var o=JSON.parse(String(txt||'').trim());

  delete o.asistanim;delete o.surum;delete o.aktarim;return o;
}
function doImport(){
  var ta=document.getElementById('imptxt'),txt=ta?ta.value:'';
  if(!txt.trim()){ui.dataMsg='Önce dışa aktarılan metni yapıştırın ya da dosya seçin.';ui.importArm=false;render();return;}
  var o;try{o=parseImport(txt);}catch(e){ui.dataMsg='Okunamadı: '+(/Asistanım/.test(e.message||'')?e.message:'metin eksik ya da bozuk. Dışa aktarılan metnin tamamını yapıştırın.');ui.importArm=false;render();return;}
  if(!ui.importArm){ui.importArm=true;ui.pendingImport=txt;ui.dataMsg='Gelen veri: '+stateSummary(o)+'. Onaylamak için düğmeye tekrar basın.';render();var t2=document.getElementById('imptxt');if(t2) t2.value=txt;return;}
  state=normalizeState(o);ui.importArm=false;ui.pendingImport='';ui.dataMsg='✓ Veriler içe aktarıldı: '+stateSummary(state)+'.';commit();
}
function copyText(txt,btn){
  function ok(){btn.textContent='✓ Kopyalandı';setTimeout(function(){btn.textContent='Kopyala';},2000);}
  function fallback(){var ta=document.getElementById('exptxt');try{ta.focus();ta.select();ta.setSelectionRange(0,txt.length);if(document.execCommand('copy')) ok();else btn.textContent='Metni seçip kopyalayın';}catch(e){btn.textContent='Metni seçip kopyalayın';}}
  try{if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();}catch(e){fallback();}
}

document.addEventListener('click',function(e){

  var a=el.dataset.act,id=el.dataset.id;
  if(['pdel','edel','hdel','cdel','tdel','sdel','wdel','adel'].indexOf(a)<0) ui.arm=null;

  if(a==='dimport'){doImport();return;}

  if(a==='wadraft'){draftWa(id,el);return;}
  if(a==='waedit'){ui.waedit=ui.waedit===id?null:id;render();return;}
  if(a==='wacancel'){ui.waedit=null;render();return;}
  if(a==='waclear'){state.social.wa=state.social.wa.filter(function(w){return !w.done;});commit();return;}
  if(a==='tab'){ui.tab=el.dataset.t;try{history.replaceState(null,'','#'+ui.tab);}catch(x){location.hash=ui.tab;}render();if(el.classList.contains('hs')){var nv=document.querySelector('nav');if(nv) nv.scrollIntoView({behavior:'smooth',block:'start'});}}

  else if(a==='wd'){ui.wd=+el.dataset.i;render();}

  '{"type":"add_post","acc":"instagram hesap id","kind":"gonderi|reels|hikaye","title":"...","date":"YYYY-MM-DD","time":"HH:MM","status":"fikir|hazirlaniyor|planlandi|paylasildi","caption":""}  (Instagram içeriği planla)\n'+
  '{"type":"post_status","id":"planlananIcerik id","status":"fikir|hazirlaniyor|planlandi|paylasildi"}\n'+
  '{"type":"add_wa","acc":"whatsapp hesap id","who":"kişi/grup","topic":"konu","due":"YYYY-MM-DD","phone":"","msg":"gönderilecek hazır mesaj metni (mesaj yazmasını istediyse yaz; bilinmeyenler için [SAAT] gibi yer tutucu; Levent Şanlı imzalı)"}  (WhatsApp takibi / mesaj taslağı ekle; kullanıcı WhatsApp’ta gönder düğmesiyle kendisi gönderir, sen gönderemezsin)\n'+
  '{"type":"wa_done","id":"whatsappTakip id"}\n'+
  '{"type":"go","tab":"bugun|hafta|okul|odemeler|kulup|aile|kisisel|sosyal"}  (ilgili ekranı aç)\n'+
  'Kurallar: Tarih söylenmezse bugunTarih. Tutar belirsizse eylem üretme, kısaca sor. "reply" sesli okunacak: en fazla 4 kısa cümle (öneri listesinde de), düz metin, emoji ve madde işareti yok, tutarları "1.800 lira" gibi yaz, saatleri "14.15" gibi yaz. Kaydettiğin şeyi tek cümleyle teyit et. Önceki konuşma bağlam içindir. Kişisel verisi hakkında bilmediğin şeyi uydurma.';
}
function findPay(t){var tt=lc(t),best=null;state.payments.forEach(function(p){var w=lc(p.name).split(/[\s\/]+/).filter(function(x){return x.length>2;});if(!best&&w.some(function(x){return tt.indexOf(x)>=0;})) best=p;});return best;}
function guessType(t){var m=[[/otobüs|minibüs|ulaşım|deplasman|yakıt|benzin|mazot/,'Ulaşım / deplasman'],[/hakem|gözlemci/,'Hakem ve maç giderleri'],[/forma|top|malzeme|krampon|eşofman|çanta|konik/,'Malzeme / forma'],[/saha|tesis|kira/,'Saha kirası'],[/lisans|federasyon|tff|askf|vize/,'Lisans / federasyon'],[/antrenör|hoca|maaş|personel/,'Antrenör / personel'],[/sağlık|doktor|fizyo|ilaç|masör/,'Sağlık / fizyoterapi'],[/yemek|ikram|çay|kumanya/,'Yemek / ikram'],[/turnuva|organizasyon|tören|ödül/,'Organizasyon']];
  for(var i=0;i<m.length;i++) if(m[i][0].test(t)) return m[i][1];return 'Diğer';}
function cleanName(q,num,words){var x=q.replace(words,'');if(num) x=x.replace(num,'');x=x.replace(/[,.]+/g,' ').replace(/\s+/g,' ').trim();return x?x.charAt(0).toLocaleUpperCase('tr')+x.slice(1):'';}
function sayMoney(n){return money(n).replace('₺','')+' lira';}
function suggestNow(){V.open=true;renderVoice();if(!V.busy) handleVoice('Şu anki saatime ve durumuma göre bana bugün için öneriler ver.');}
function localSuggest(){
  var d=today(),now=new Date(),nm=now.getHours()*60+now.getMinutes(),wk=weekDates(d),out=[];
  var late=upcoming().filter(function(x){return stat(x)==='late';});if(late.length) out.push('Önce geciken ödemeyi halledin: '+late[0].p.name+'.');
  var soon=upcoming().filter(function(x){return stat(x)==='soon';});if(soon.length) out.push(soon[0].p.name+' ödemesi yaklaşıyor, bugün aradan çıkarabilirsiniz.');
  var behind=state.habits.filter(function(h){return weekCount(h.id,wk)<h.target;});if(behind.length) out.push('Bu hafta '+lc(behind[0].name)+' hedefinin gerisindesiniz; akşam kişisel zamanınızda buna yer açın.');
  var area=nm<780?'okul':nm<1140?'kulup':'aile',open=(state.todos[area]||[]).filter(function(x){return !x.done;});if(open.length) out.push(AREAS[area].t+' listenizde sırada: '+open[0].text+'.');
  if(out.length<2) out.push(nm<780?'Öğle molasında 15 dakika telefonsuz kalın; öğleden sonra daha dinç olursunuz.':nm<1140?'Kulüpten çıkmadan yarının listesini yazın, iş eve taşınmasın.':'Bu akşam telefonu kenara koyup aileyle kısa bir yürüyüşe çıkın.');
  return out.slice(0,3).join(' ');
}
function localParse(q){
  var t=lc(q);if(/öneri|tavsiye|ne yapsam|ne önerirsin/.test(t)) return {reply:localSuggest(),actions:[]};
  var d=today(),key=ymd(d),now=new Date(),nm=now.getHours()*60+now.getMinutes();
  var num=q.match(/(\d[\d.]*(?:,\d+)?)/),amt=num?parseFloat(num[1].replace(/\./g,'').replace(',','.')):0;
  var method=/kart/.test(t)?'Kredi kartı':/havale|eft/.test(t)?'Havale / EFT':/kulüp hesab/.test(t)?'Kulüp hesabı':'Nakit';
  if(/reels|hikaye|gönderi|post/.test(t)&&/ekle|planla|paylaş/.test(t)){var kd=/reels/.test(t)?'reels':/hikaye/.test(t)?'hikaye':'gonderi';var tt=cleanName(q,null,/reels|hikayesi|hikaye|gönderisi|gönderi|post|ekle|planla|paylaş/gi)||'Yeni içerik';
    return {reply:SKINDS[kd]+' içerik takvimine eklendi: '+tt+'.',actions:[{type:'add_post',kind:kd,title:tt,date:key,status:'planlandi'},{type:'go',tab:'sosyal'}]};}
  if(/whatsapp|mesaj|grubuna|yaz/.test(t)&&/hatırlat|takip|ekle/.test(t)){var wt=cleanName(q,null,/whatsapp|hatırlat|takip|ekle|listesine/gi)||'Mesaj';return {reply:'WhatsApp takip listesine eklendi: '+wt+'.',actions:[{type:'add_wa',who:wt,topic:'Takip',due:key},{type:'go',tab:'sosyal'}]};}
  if(/ödendi|ödedim/.test(t)&&!(amt>0)){var p=findPay(t);if(p) return {reply:p.name+' bu ay için ödendi olarak işaretlendi.',actions:[{type:'mark_paid',id:p.id}]};return {reply:'Hangi ödemeyi kastettiğinizi bulamadım. Ödemenin adını söyler misiniz?',actions:[]};}
  if(amt>0&&/kulüp|orhaniye/.test(t)){var n1=cleanName(q,num&&num[1],/kulübün|kulübe|kulüp|orhaniyespor|harcamasını|harcaması|harcama|ekle|lira|tl|nakit|kartla|kredi kartı|kart|havale|eft|₺/gi)||'Kulüp harcaması',ty=guessType(t);
    return {reply:'Kulüp harcaması eklendi: '+n1+', '+ty+', '+sayMoney(amt)+'.',actions:[{type:'add_club',name:n1,ptype:ty,amount:amt,date:key,method:method},{type:'go',tab:'kulup'}]};}
  if(amt>0){var n2=cleanName(q,num&&num[1],/lira|tl|₺|harcamasını|harcaması|harcama|ekle|aldım|ödedim/gi)||'Harcama';
    var cat=/market|bakkal|manav/.test(t)?'Market':/yemek|kahve|çay|lokanta/.test(t)?'Yemek':/yakıt|benzin|otobüs|taksi|metro|köprü/.test(t)?'Ulaşım / Yakıt':'Diğer';
    return {reply:'Günlük harcama eklendi: '+n2+', '+sayMoney(amt)+'.',actions:[{type:'add_expense',name:n2,cat:cat,amount:amt,date:key}]};}
  if(/yarın/.test(t)){var tm=new Date(d);tm.setDate(d.getDate()+1);var bl=schedule(tm.getDay()),fo=bl.filter(function(b){return b.c==='kulup'&&/Odak|maç/i.test(b.t);})[0];
    return {reply:'Yarın '+DAYS[tm.getDay()]+'. Gün '+bl[0].s.replace(':','.')+' ile başlıyor.'+(fo?' Kulüpte '+fo.t.replace('Odak: ','').toLocaleLowerCase('tr')+' var.':''),actions:[{type:'go',tab:'hafta'}]};}
  if(/ödeme|fatura/.test(t)){var up=upcoming();if(!up.length) return {reply:'Önümüzdeki yedi günde bekleyen ödemeniz görünmüyor.',actions:[{type:'go',tab:'odemeler'}]};
    return {reply:'Yaklaşan ödemeler: '+up.slice(0,4).map(function(x){return x.p.name+', '+lc(statLabel(x))+', '+sayMoney(x.p.amount);}).join('; ')+'.',actions:[{type:'go',tab:'odemeler'}]};}
  if(/bugün|şimdi|plan|program|ne var/.test(t)){var bl2=schedule(d.getDay()),cur=null,nx=null;bl2.forEach(function(b){if(nm>=toMin(b.s)&&nm<toMin(b.e)) cur=b;else if(!nx&&toMin(b.s)>nm) nx=b;});
    return {reply:(cur?'Şu an '+cur.t+' zamanı. ':'')+(nx?'Sırada saat '+nx.s.replace(':','.')+' itibarıyla '+nx.t+' var.':'Bugünün planı tamamlandı, iyi dinlenmeler.'),actions:[{type:'go',tab:'bugun'}]};}
  if(V.s===null&&V.ready) return {reply:(STANDALONE?'Genel soruları ve önerileri Claude ile yanıtlayabilmem için asistanı Claude uygulamasında açın.':'Genel soruları yanıtlayabilmem için Claude erişimine izin verilmesi gerekiyor.')+' Şimdilik plan, ödeme ve harcama komutlarını anlayabiliyorum.',actions:[]};
  return {reply:'Bunu anlayamadım. Örneğin “Kulüp harcaması, hakem ücreti 1800 lira” ya da “Bugün ne var?” diyebilirsiniz.',actions:[]};
}
function applyActions(list){
  var changed=false,key=ymd(today());
  (Array.isArray(list)?list:[]).forEach(function(a){
    if(!a||!a.type) return;var amt=Math.round((parseFloat(a.amount)||0)*100)/100,dt=/^\d{4}-\d{2}-\d{2}$/.test(a.date||'')?a.date:key;
    if(a.type==='add_club'&&amt>0){state.club.push({id:uid(),date:dt,name:String(a.name||'Kulüp harcaması'),type:String(a.ptype||'Diğer'),amount:amt,method:METHODS.indexOf(a.method)>=0?a.method:'Nakit',note:String(a.note||'')});changed=true;}
    else if(a.type==='add_expense'&&amt>0){state.daily.push({id:uid(),date:dt,name:String(a.name||'Harcama'),cat:ECATS.indexOf(a.cat)>=0?a.cat:'Diğer',amount:amt});changed=true;}
    else if(a.type==='mark_paid'){var p=state.payments.filter(function(x){return x.id===a.id;})[0];if(p){var mk=key.slice(0,7);state.paid[mk]=state.paid[mk]||{};state.paid[mk][p.id]=key;changed=true;}}
    else if(a.type==='add_payment'&&a.name){var fq=FREQ[a.freq]?a.freq:'aylik';state.payments.push({id:uid(),name:String(a.name),cat:PCATS.indexOf(a.cat)>=0?a.cat:'Diğer',amount:amt,freq:fq,due:Math.min(31,Math.max(1,parseInt(a.due,10)||1)),month:parseInt(a.month,10)||1,date:fq==='tek'?dt:'',note:''});changed=true;}
    else if(a.type==='habit'&&state.habits.some(function(h){return h.id===a.id;})){state.habitLog[key]=state.habitLog[key]||{};state.habitLog[key][a.id]=true;changed=true;}
    else if(a.type==='check_block'&&parseInt(a.index,10)>=0){state.checks[key]=state.checks[key]||{};state.checks[key][parseInt(a.index,10)]=true;changed=true;}
    else if(a.type==='add_post'&&a.title){var ia=accs('instagram'),acc=ia.some(function(x){return x.id===a.acc;})?a.acc:(ia[0]||{}).id;state.social.posts.push({id:uid(),acc:acc,kind:SKINDS[a.kind]?a.kind:'gonderi',title:String(a.title),date:/^\d{4}-\d{2}-\d{2}$/.test(a.date||'')?a.date:key,time:/^\d{2}:\d{2}$/.test(a.time||'')?a.time:'',status:SSTAT[a.status]?a.status:'planlandi',caption:String(a.caption||'')});changed=true;}
    else if(a.type==='post_status'&&SSTAT[a.status]){state.social.posts.forEach(function(x){if(x.id===a.id){x.status=a.status;changed=true;}});}
    else if(a.type==='add_wa'&&a.who){var wa=accs('whatsapp'),wacc=wa.some(function(x){return x.id===a.acc;})?a.acc:(wa[0]||{}).id;state.social.wa.push({id:uid(),acc:wacc,who:String(a.who),topic:String(a.topic||''),due:/^\d{4}-\d{2}-\d{2}$/.test(a.due||'')?a.due:key,phone:String(a.phone||''),msg:String(a.msg||''),done:false});changed=true;}
    else if(a.type==='wa_done'){state.social.wa.forEach(function(x){if(x.id===a.id){x.done=true;changed=true;}});}
    else if(a.type==='add_todo'&&a.text&&AREAS[a.area]){state.todos[a.area]=state.todos[a.area]||[];state.todos[a.area].push({id:uid(),text:String(a.text),done:false,date:key});changed=true;}
    else if(a.type==='go'&&['bugun','hafta','okul','odemeler','kulup','aile','kisisel','sosyal'].indexOf(a.tab)>=0){ui.tab=a.tab;try{history.replaceState(null,'','#'+a.tab);}catch(x){}}
  });
  return changed;
}
async function handleVoice(q){
  cancelClose();V.q=q;V.busy=true;V.err='';V.reply='Düşünüyorum…';renderVoice();
  var res=null;
  if(V.s){try{var msgs=V.hist.slice(-6).concat([{role:'user',content:voicePrompt(q)}]);res=await V.s.json(msgs,{modelTier:'default',cache:false});}catch(e){if(e&&e.code==='not_granted') V.s=null;res=null;}}
  if(!res||typeof res!=='object'||typeof res.reply!=='string') res=localParse(q);
  var changed=applyActions(res.actions);
  V.reply=res.reply||'Tamam.';V.busy=false;V.hist.push({role:'user',content:q},{role:'assistant',content:V.reply});render();renderVoice();
  try{sessionStorage.setItem('lastVoice',JSON.stringify({q:q,a:V.reply,at:Date.now()}));}catch(e){}
  var spoke=false;
  if(V.t&&V.speak){try{await V.t.speak(V.reply,{language:'tr'});spoke=true;}catch(e){}}
  scheduleClose(spoke?2500:Math.max(6000,V.reply.length*70));
  if(changed) commit();
}
renderVoice();
fromHash();render();
setInterval(function(){var a=document.activeElement;if(ui.tab==='bugun'&&!(a&&/INPUT|SELECT/.test(a.tagName))) render();},60000);
})();
</script>
